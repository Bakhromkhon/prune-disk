[workspace]
resolver = "2"
members = ["crates/prune-core", "crates/prune-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Conservative supported baseline, tested in CI; not the theoretical dependency minimum.
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bakhromkhon/prune-disk"
authors = ["Bakhromkhon Murodov"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
humansize = "2.1"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10.9", default-features = false }
thiserror = "2.0"
toml = "0.8"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
