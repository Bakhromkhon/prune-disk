name: Feature request
description: Suggest a feature, a workflow, or a safety improvement.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanner
        - Rules
        - CLI/TUI
        - GUI
        - History/diff
        - Cleanup/quarantine/undo
        - Cross-platform
        - Documentation
        - Security
    validations:
      required: true
