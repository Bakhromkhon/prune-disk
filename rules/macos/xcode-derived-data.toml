id = "xcode-derived-data"
name = "Xcode DerivedData"
description = "Build artifacts, indexes and logs generated by Xcode. Xcode recreates them on the next build, though the first build after cleanup will be slower."
os = ["macos"]
category = "developer"
risk = "safe"
recreate = "automatic"
paths = ["~/Library/Developer/Xcode/DerivedData/*"]
